name: K3s Build and Push (Reusable)

on:
  workflow_call:
    inputs:
      contexts:
        description: 'Comma-separated list of build contexts (e.g., "./frontend,./backend")'
        required: true
        type: string
      images:
        description: 'Comma-separated list of image names (e.g., "worldguess-frontend,worldguess-backend")'
        required: true
        type: string
      dockerfiles:
        description: 'Comma-separated list of Dockerfiles (optional, defaults to Dockerfile in each context)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: '192.168.2.201:5000'
      buildkit-endpoint:
        description: 'BuildKit endpoint'
        required: false
        type: string
        default: 'tcp://buildkit.buildkit.svc.cluster.local:1234'

jobs:
  build-and-push:
    runs-on: [self-hosted, buildkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ inputs.buildkit-endpoint }}

      - name: Build and push images
        run: |
          IFS=',' read -ra CONTEXTS <<< "${{ inputs.contexts }}"
          IFS=',' read -ra IMAGES <<< "${{ inputs.images }}"
          IFS=',' read -ra DOCKERFILES <<< "${{ inputs.dockerfiles }}"

          for i in "${!CONTEXTS[@]}"; do
            CONTEXT="${CONTEXTS[$i]}"
            IMAGE="${IMAGES[$i]}"
            DOCKERFILE="${DOCKERFILES[$i]:-Dockerfile}"

            BUILD_ARGS="--push --tag ${{ inputs.registry }}/${IMAGE}:latest"

            if [ "$DOCKERFILE" != "Dockerfile" ]; then
              BUILD_ARGS="$BUILD_ARGS --file $DOCKERFILE"
            fi

            echo "Building ${IMAGE} from ${CONTEXT}..."
            docker buildx build $BUILD_ARGS $CONTEXT
          done
